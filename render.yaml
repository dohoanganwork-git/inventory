# Render Blueprint – triển khai backend Spring Boot (Docker).
# CSDL MySQL đặt ở dịch vụ bên ngoài (Aiven for MySQL / TiDB Cloud) – điền các biến DB_* trên Render.
services:
  - type: web
    name: kho-songdem-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SEED_DATA
        value: "true"
      - key: DB_POOL_SIZE
        value: "3"
