server:
  port: ${PORT:8080}

spring:
  application:
    name: kho-songdem
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kho_songdem?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:kho}
    password: ${DB_PASSWORD:kho123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:doi-chuoi-bi-mat-nay-khi-trien-khai-thuc-te-it-nhat-32-ky-tu}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  seed:
    enabled: ${SEED_DATA:true}
  timezone: Asia/Ho_Chi_Minh
